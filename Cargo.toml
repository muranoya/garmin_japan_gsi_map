[package]
name = "gsi2garmin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures = "0.3"
geo = "0.33"
indicatif = "0.18"
png = "0.18"
prost = "0.14"
rayon = "1"
reqwest = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
